# Añadir estas ubicaciones DENTRO del servidor existente de dinamicas-back.duckdns.org.
location /concurso-benet-api/ {
    proxy_pass http://127.0.0.1:5010/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /concurso-benet-admin/ {
    proxy_pass http://127.0.0.1:5010/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /concurso-benet-admin;
    proxy_set_header X-Forwarded-Proto $scheme;
}
