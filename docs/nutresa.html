<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutresa | Concurso Bénet</title><link rel="stylesheet" href="assets/style.css"></head><body class="ops-body"><header class="ops-header"><div class="ops-brand"><img src="assets/LOGO%20B%C3%89NET.png" alt="Bénet"><span>Panel Nutresa</span></div></header><main class="ops-main" id="app"><section class="ops-card"><h2>Ingreso Nutresa</h2><form id="login"><p><input name="usuario" placeholder="Usuario" required></p><p><input name="password" type="password" placeholder="Contraseña" required></p><button class="brand-button">INGRESAR</button></form><p id="error"></p></section></main><script>const API='https://vague-monika-preimportantly.ngrok-free.dev/concurso-benet-api';let token=sessionStorage.getItem('benetNutresa');async function cargar(){let r=await fetch(API+'/api/laboratorio/participantes',{headers:{Authorization:'Bearer '+token}});if(!r.ok){sessionStorage.removeItem('benetNutresa');token='';return}let d=await r.json();app.innerHTML='<section class="ops-intro"><div><h1>Selección de ganadores</h1><p>Fotos confirmadas por los PDV.</p></div></section><section class="ops-card"><div class="lab-grid">'+d.participantes.map(p=>`<article class="lab-photo ${p.posicion_ganadora?'winner':''}"><img src="${p.url}"><div class="lab-photo-content"><div class="ops-code">${p.codigo}</div><h3>${p.nombre}</h3><p>${p.regional||''}</p><select onchange="ganador(${p.foto_id},this.value)"><option value="">Asignar puesto...</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${p.posicion_ganadora==n?'selected':''}>Puesto ${n}</option>`).join('')}</select></div></article>`).join('')+'</div></section>'}async function ganador(id,posicion){if(!posicion)return;let r=await fetch(API+'/api/laboratorio/ganadores/'+id,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({posicion})});if(!r.ok)alert((await r.json()).error);cargar()}login.onsubmit=async e=>{e.preventDefault();let f=new FormData(login),r=await fetch(API+'/api/laboratorio/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:f.get('usuario'),password:f.get('password')})}),d=await r.json();if(!r.ok){error.textContent=d.error;return}token=d.token;sessionStorage.setItem('benetNutresa',token);cargar()};if(token)cargar()</script></body></html>
