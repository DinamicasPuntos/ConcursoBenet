<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutresa | Concurso Bénet</title><link rel="stylesheet" href="assets/style.css"></head>
<body class="ops-body"><header class="ops-header"><div class="ops-brand"><img src="assets/LOGO%20B%C3%89NET.png" alt="Bénet"><span>Panel Nutresa</span></div></header><main class="ops-main" id="app"><section class="ops-card"><h2>Ingreso Nutresa</h2><form id="login"><p><input name="usuario" placeholder="Usuario" required></p><p><input name="password" type="password" placeholder="Contraseña" required></p><button class="brand-button">INGRESAR</button></form><p id="mensaje"></p></section></main>
<script>
const API='https://vague-monika-preimportantly.ngrok-free.dev/concurso-benet-api';
const app=document.getElementById('app'),formulario=document.getElementById('login'),mensaje=document.getElementById('mensaje');let token=sessionStorage.getItem('benetNutresa');
async function cargar(){try{const r=await fetch(API+'/api/laboratorio/participantes',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error();const d=await r.json();app.innerHTML='<section class="ops-intro"><div><h1>Selección de ganadores</h1><p>Fotos confirmadas por los PDV.</p></div></section><section class="ops-card"><div class="lab-grid">'+d.participantes.map(p=>`<article class="lab-photo ${p.posicion_ganadora?'winner':''}"><img src="${p.url}" alt="Participación ${p.codigo}"><div class="lab-photo-content"><div class="ops-code">${p.codigo}</div><h3>${p.nombre}</h3><p>${p.regional||''}</p><select onchange="ganador(${p.foto_id},this.value)"><option value="">Asignar puesto...</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${p.posicion_ganadora==n?'selected':''}>Puesto ${n}</option>`).join('')}</select></div></article>`).join('')+'</div></section>';}catch(e){sessionStorage.removeItem('benetNutresa');token='';mensaje.textContent='No fue posible abrir el panel. Ingresa nuevamente.';}}
async function ganador(id,posicion){if(!posicion)return;const r=await fetch(API+'/api/laboratorio/ganadores/'+id,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({posicion})});if(!r.ok)alert((await r.json()).error);cargar();}
formulario.addEventListener('submit',async e=>{e.preventDefault();mensaje.textContent='Validando acceso...';try{const datos=new FormData(formulario);const r=await fetch(API+'/api/laboratorio/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:datos.get('usuario'),password:datos.get('password')})});const respuesta=await r.json();if(!r.ok){mensaje.textContent=respuesta.error||'No fue posible ingresar.';return;}token=respuesta.token;sessionStorage.setItem('benetNutresa',token);cargar();}catch(e){mensaje.textContent='No fue posible conectar con el servidor. Intenta nuevamente.';}});
if(token)cargar();
</script></body></html>
