<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concurso Bénet</title><link rel="stylesheet" href="assets/style.css"></head><body class="brand-body"><main class="landing"><section class="brand-hero"><header class="brand-header"><img class="brand-logo" src="assets/LOGO%20B%C3%89NET.png" alt="Bénet"><span class="header-pill">CONCURSO DE EXHIBICIÓN</span></header><div class="hero-grid"><div class="hero-copy"><span class="eyebrow-brand">25 AGO — 15 SEP</span><h1>Tu exhibición puede ser <em>la ganadora</em></h1><p>Comparte tu mejor exhibición Bénet y participa por una canasta espectacular.</p><div class="hero-benefits"><span>✦ Hasta 5 oportunidades</span><span>✦ Sube tu foto</span></div></div><div class="hero-poster-wrap"><img class="hero-poster" src="assets/CONCURSO%20BENET%20AGOSTO%20PDV%20MOVIL.png" alt="Concurso Bénet"></div></div></section><section class="search-section"><div class="section-kicker">PASO 1</div><div class="search-card"><div class="search-title"><span class="search-icon">⌕</span><div><h2>Encuentra tu punto de venta</h2><p>Busca por nombre, código o comercial.</p></div></div><label class="brand-search"><span>🔎</span><input id="buscar" placeholder="Escribe el nombre o código de tu PDV"></label><div id="resultados" class="results"></div></div></section><section class="product-strip"><img src="assets/PRODUCTOS%20PROTAGONISTAS%20B%C3%89NET.png" alt="Productos Bénet"></section></main><script>const API='https://vague-monika-preimportantly.ngrok-free.dev/concurso-benet-api';let t;buscar.oninput=()=>{clearTimeout(t);let q=buscar.value.trim();if(q.length<2){resultados.innerHTML='';return}t=setTimeout(async()=>{let d=await fetch(API+'/buscar-pdv?q='+encodeURIComponent(q)).then(r=>r.json());resultados.innerHTML=(d.pdvs||[]).map(p=>`<a class="pdv-result" href="pdv.html?id=${p.id}"><span class="pdv-result-icon">⌖</span><span class="pdv-info"><strong>${p.nombre}</strong><small>Código ${p.codigo}</small></span><span class="result-arrow">→</span></a>`).join('')||'<div class="empty-state">No encontramos ese PDV.</div>'},250)}</script></body></html>
