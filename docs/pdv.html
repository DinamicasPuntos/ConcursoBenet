<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDV | Concurso Bénet</title><link rel="stylesheet" href="assets/style.css"></head><body class="brand-body"><header class="pdv-brand-header"><a class="back-link" href="index.html">← Cambiar PDV</a><img src="assets/LOGO%20B%C3%89NET.png" alt="Bénet"></header><main class="pdv-main" id="app">Cargando...</main><script>const API='https://vague-monika-preimportantly.ngrok-free.dev/concurso-benet-api',id=new URLSearchParams(location.search).get('id');async function cargar(){let d=await fetch(API+'/api/pdv/'+id).then(r=>r.json());if(d.error){app.textContent=d.error;return}document.title=d.pdv.nombre+' | Concurso Bénet';app.innerHTML=`<section class="pdv-banner"><span class="eyebrow-brand">TU PUNTO DE VENTA</span><h1>${d.pdv.nombre}</h1><p>Código PDV: <b>${d.pdv.codigo}</b></p></section><section class="attempts-panel"><div><span>OPORTUNIDADES DISPONIBLES</span><strong>${d.oportunidades}</strong></div></section>${d.concurso.abierto&&d.oportunidades>0?`<section class="upload-panel"><div class="panel-heading"><span>02</span><div><h2>Sube tu mejor foto</h2><p>JPG, PNG o WEBP · máximo 10 MB</p></div></div><form id="subir"><label class="photo-picker">📸<b>TOMAR O SELECCIONAR FOTO</b><input type="file" name="foto" accept="image/*" required></label><button class="brand-button">SUBIR MI FOTO →</button></form></section>`:''}<section class="photo-section"><div class="panel-heading"><span>03</span><div><h2>Tus fotografías</h2><p>Elige tu favorita.</p></div></div><div class="photos-grid">${d.fotos.map(f=>`<article class="photo-card ${f.seleccionada?'favorite':''}"><img src="${f.url}" alt="Foto ${f.intento}"><div class="photo-meta">FOTO ${f.intento}</div>${d.concurso.abierto?`<button class="select-button" onclick="accion('seleccionar/${f.id}')">${f.seleccionada?'★ MI FAVORITA':'ELEGIR ESTA'}</button>`:''}</article>`).join('')}</div></section>${d.concurso.abierto&&d.fotos.some(f=>f.seleccionada)?'<button class="brand-button green" onclick="accion(\'confirmar\')">CONFIRMAR / ACTUALIZAR PARTICIPACIÓN</button>':''}`;let f=document.getElementById('subir');if(f)f.onsubmit=async e=>{e.preventDefault();await fetch(API+'/pdv/'+id+'/subir',{method:'POST',body:new FormData(f)});cargar()}}async function accion(x){await fetch(API+'/pdv/'+id+'/'+x,{method:'POST'});cargar()}cargar()</script></body></html>
